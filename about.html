<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ラク売り計算について</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.8;max-width:760px;margin:auto;padding:24px;color:#222}h1{color:#174b35}a{color:#1769aa}</style></head><body><h1>ラク売り計算について</h1><p>ラク売り計算は、商品の仕入れや販売に関する数字を整理し、利益の目安を確認するための計算ツールです。</p><h2>できること</h2><ul><li>仕入れや経費を入力して計算する</li><li>利益や損益分岐点の目安を確認する</li><li>販売価格を検討する際の参考にする</li></ul><p>計算結果は入力内容に基づく目安です。実際の利益は、税金、手数料、廃棄、その他の経費などによって変わります。最終的な判断はご自身でご確認ください。</p><p><a href="./index.html">ラク売り計算に戻る</a></p></body></html>
