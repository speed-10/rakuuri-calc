<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ラク売り計算の使い方</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.8;max-width:760px;margin:auto;padding:24px;color:#222}h1{color:#174b35}a{color:#1769aa}</style></head><body><h1>ラク売り計算の使い方</h1><ol><li>計算画面を開き、商品や仕入れに関する項目を入力します。</li><li>販売価格、原価、その他の費用など、必要な数字を入力します。</li><li>計算ボタンがある場合は押して、表示された結果を確認します。</li><li>販売価格や仕入れ条件を変えて、利益の目安を比較します。</li></ol><h2>使うときの注意</h2><p>入力漏れや単位の間違いがあると結果も変わります。計算結果は目安として利用し、実際の売上・経費と照らし合わせてください。</p><p><a href="./index.html">ラク売り計算に戻る</a></p></body></html>
